# DEPRECATED — Production deploy is Cloudflare Pages (project: finance-plus).
# Kept only for emergency rollback via `npm run build:node` + Render dashboard.
# See wrangler.jsonc and `npm run deploy:cloudflare`.

services:
  - type: web
    name: finance-plus
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
